<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mercearia Proz_ADM</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Mercearia Proz</a>
            <a class="btn btn-outline-light btn-sm" href="index.html">Voltar páginaínicial</a>
        </div>
    </nav>
    <main class="container mt-4">
        <h1>Criar Produtos</h1>
        <form id="formCadastro" class="formulario-cadastro">
            <div class="mb-3"> <label for="nome" class="form-label"> Nome do Produto </label> <input type="text"
                    id="nome" class="form-control" required> </div>
            <div class="mb-3"> <label for="preco" class="form-label"> Preço do Produto </label> <input type="text"
                    id="preco" class="form-control" inputmode="decimal" required> </div>
            <div class="mb-3"> <label for="categoria" class="form-label"> Categoria do Produto </label> <input
                    type="text" id="categoria" class="form-control" required> </div>
            <div class="d-flex gap-2 mt-4 mb-3"> <button type="reset" class="btn btn-danger"> Limpar </button>
                <button type="submit" class="btn btn-success" id="enviar"> Enviar </button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered tabela-produtos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Categoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="itens">
                </tbody>
            </table>
        </div>

    </main>
    <script src="assets/js/scriptAdmin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <footer class="border-top py-4">
        <div class="container text-secondary small text-alieng-center">
            &copy; 2026 Mercado Proz - MOC_city, MG
        </div>
    </footer>
</body>

</html>
